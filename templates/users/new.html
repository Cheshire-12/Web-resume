<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="create_user" content="width=device-width, initial-scale=1.0">
    <title>Новый пользователь</title>
</head>
<body>
    <!-- templates/users/new.html -->
  <a href="/">Главная</a>
  <h1>Новый пользователь</h1>
  <form action="{{ url_for('users_post') }}" method="post">
    <div>
      <label>
        Имя
        <input type="text" name="name" value="{{ user.name }}">
      </label>
      {% if errors['name'] %}
        <div>{{ errors['name'] }}</div>
      {% endif %}
    </div>
    <div>
      <label>
        Email
        <input type="email" required name="email" value="{{ user.email }}">
      </label>
      {% if errors['email'] %}
        <div>{{ errors['email'] }}</div>
      {% endif %}
      </div>
    <div>
      <label>
        Пароль
        <input type="password" required name="password" value="{{ user.password }}">
      </label>
      {% if errors['password'] %}
        <div>{{ errors['password'] }}</div>
      {% endif %}
    </div>
    <input type="submit" value="Sign Up">
  </form>
</body>
</html>
